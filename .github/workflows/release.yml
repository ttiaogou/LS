
name: Build Debug APKs

on:
  workflow_dispatch: # 允许在 GitHub Actions 网页端手动触发

# 只需要读取仓库代码。
# 删除 contents: write，因为不再创建 Tag 和 GitHub Release。
permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      # 获取项目源码。
      # 不再需要 fetch-depth: 0，因为不再读取历史 Tag 或生成 Changelog。
      - name: Checkout Code
        uses: actions/checkout@v4

      # 保留 JDK 17，与项目 Java/Kotlin 编译目标一致。
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 只编译两个 Debug 变体，不编译 Release。
      - name: Build Debug APKs
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          # Scoped：非全局方案，在 LSPosed 作用域内 Hook 目标应用。
          ./gradlew --no-daemon :app:assembleScopedDebug

          # Global：全局方案，包含 Native 传感器层。
          ./gradlew --no-daemon :app:assembleGlobalDebug

          # 检查是否准确生成两个 arm64 Debug APK。
          mapfile -t APK_FILES < <(
            find app/build/outputs/apk \
              -type f \
              -path '*/debug/*' \
              -name '*arm64-v8a*.apk' | sort
          )

          if [[ ${#APK_FILES[@]} -ne 2 ]]; then
            echo "错误：预期生成两个 arm64 Debug APK。"
            echo "实际找到 ${#APK_FILES[@]} 个："
            printf '%s\n' "${APK_FILES[@]}"
            exit 1
          fi

          echo "Debug APK 检查通过："
          printf '%s\n' "${APK_FILES[@]}"

      # 保留 JNI 检查。
      # 防止 Java native 方法声明与 C++ 导出符号不匹配。
      # 必须在 Global Debug 编译之后执行。
      - name: Verify JNI Export Names
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:verifyJniExports

      # 上传两个 Debug APK 到 GitHub Actions Artifact。
      # 不需要 Release 签名密钥，不创建 GitHub Release。
      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-debug-apks-${{ github.run_number }}
          path: app/build/outputs/apk/*/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
