org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.builtInKotlin=false
android.newDsl=false

# 单一版本号来源：:app 和 :app-ui 都从这里读取，避免多模块拆分后版本号各写一份、逐渐漂移
APP_VERSION_CODE=30100
APP_VERSION_NAME=3.1.0

# 默认走本仓库自建的开源 native 传感器层（sensor-native）：
# 全局步数注入与 wakeup/non-wake 两套句柄都在这一层，无需再传 -PnativeSensorBackend。
# 仅支持 arm64-v8a；诊断可选 probe / passthrough，不再支持 legacy 或闭源预编译库。
nativeSensorBackend=steps
